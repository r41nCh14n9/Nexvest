[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=65", "wheel"]

[project]
name = "nexvest"
version = "1.0.0-alpha"
description = "AI Agent Orchestration Framework with Harness-inspired CI/CD"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nexvest Team" }]

dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit>=3.4.0",
    "black==23.12.0",
    "flake8==6.1.0",
    "isort==5.13.2",
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "bandit>=1.7.5",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = [".venv", "venv", ".git", "build", "dist"]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", ".eggs", "node_modules"]
extend-ignore = ["E203", "W503", "E501"]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:F401,F811,D100,D101,D102",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=tools",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "smoke: smoke tests",
    "slow: slow tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["tools"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abstractproperty",
]
precision = 2

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
